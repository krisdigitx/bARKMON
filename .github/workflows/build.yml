name: Test and publish barkmon
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'deploy/kustomization.yaml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: barkmon-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt -r requirements-worker.txt
      - run: ruff check .
      - run: python scripts/download_model.py
      - run: python -m pytest -q
        env:
          YAMNET_SMOKE_MODEL: models/yamnet.tflite
      - run: kubectl kustomize deploy > /tmp/barkmon.yaml
  image:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/krisdigitx/barkmon:main
            ghcr.io/krisdigitx/barkmon:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update the image digest watched by ArgoCD
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PYTHON'
          import os
          from pathlib import Path
          p = Path('deploy/kustomization.yaml')
          lines = [line for line in p.read_text().splitlines() if not line.strip().startswith(('newTag:', 'digest:'))]
          index = lines.index('  - name: ghcr.io/krisdigitx/barkmon')
          lines.insert(index + 1, '    digest: ' + os.environ['IMAGE_DIGEST'])
          p.write_text('\n'.join(lines) + '\n')
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'deploy: update barkmon image digest'
          git push origin HEAD:main
